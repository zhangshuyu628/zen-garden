<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Zen Garden - 10 Stones Fixed</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0" />
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; }
    </style>

    <script type="module">
        import zim from "https://zimjs.org/cdn/019/zim";

        new Frame({
            scaling: FIT,
            width: 768,        
            height: 1024,
            color: "#e8d8b5", 
            outerColor: "#222",
            sensors: true,
            ready: ready
        });

        function ready() {
            const trailLayer = new Container(768, 1024).addTo();
            const rippleLayer = new Container(768, 1024).addTo();
            const stoneLayer = new Container(768, 1024).addTo();
            
            let moveX = 0;
            let moveY = 0;
            let sensorsActive = false;
            let zenScore = 0;

            const stones = [];
            const stoneColors = [["#888", "#333"], ["#999", "#444"], ["#777", "#222"], ["#666", "#111"]];

            // --- 核心修复：手动实现映射逻辑，避免调用 map 报错 ---
            loop(10, (i) => {
                const radius = rand(30, 65);
                const sides = rand(5, 10);
                
                const s = new Poly({
                    radius: radius,
                    sides: sides,
                    pointSize: rand(0.3, 0.7),
                    color: new RadialColor(stoneColors[rand(stoneColors.length-1)], [0, 1])
                })
                .loc(rand(100, 668), rand(100, 924), stoneLayer)
                .sha("#000", 8, 8, 15);
                
                s.r = radius;
                // 手动计算：半径越大速度越慢 (30-65 映射到 1.5-0.6)
                s.baseSpeed = 1.5 - ((radius - 30) / (65 - 30)) * (1.5 - 0.6); 
                stones.push(s);
            });

            // 点击涟漪
            S.on("stagemousedown", (e) => {
                if (!sensorsActive) return;
                new Circle(5, "transparent", "#d2b48c", 2)
                    .loc(e.stageX, e.stageY, rippleLayer)
                    .animate({
                        props: { scale: 12, alpha: 0 },
                        time: 2,
                        ease: "quadOut",
                        call: (t) => { t.removeFrom(); }
                    });
                zenScore += 10;
                updateScore();
            });

            // 授权按钮
            const authBtn = new Button({
                label: "START ZEN GARDEN",
                width: 350,
                height: 100,
                backgroundColor: "#5d4037",
                cornerRadius: 50
            }).center();

            authBtn.tap(() => {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(res => {
                        if (res == 'granted') startGarden();
                    });
                } else {
                    startGarden();
                }
            });

            function startGarden() {
                sensorsActive = true;
                authBtn.removeFrom();
                window.addEventListener("deviceorientation", (e) => {
                    if (e.beta !== null) {
                        moveX = e.gamma * 0.45;
                        moveY = e.beta * 0.45;
                    }
                });
            }

            const scoreLabel = new Label({
                text: "ZEN: 0",
                size: 36,
                color: "#5d4037",
                bold: true
            }).pos(50, 50);

            function updateScore() {
                scoreLabel.text = "ZEN: " + Math.floor(zenScore);
            }

            new Button({
                label: "RAKE",
                width: 120,
                height: 50,
                backgroundColor: "#8b4513"
            }).pos(50, 110).tap(() => {
                trailLayer.removeAllChildren();
                zenScore = 0;
                updateScore();
            });

            Ticker.add(() => {
                if (!sensorsActive) return;

                stones.forEach(stone => {
                    stone.x += moveX * stone.baseSpeed;
                    stone.y += moveY * stone.baseSpeed;

                    if (stone.x < stone.r) stone.x = stone.r;
                    if (stone.x > 768 - stone.r) stone.x = 768 - stone.r;
                    if (stone.y < stone.r) stone.y = stone.r;
                    if (stone.y > 1024 - stone.r) stone.y = 1024 - stone.r;

                    if (Math.abs(moveX) > 0.8 || Math.abs(moveY) > 0.8) {
                        new Circle(stone.r * 0.7, "#d2b48c")
                            .loc(stone.x, stone.y, trailLayer)
                            .alp(0.08)
                            .ord(-1);
                        
                        zenScore += 0.01;
                    }
                });
                updateScore();
            });
        }
    </script>
</head>
<body></body>
</html>
